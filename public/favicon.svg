<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0a0e1a" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="fav-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3b82f6" />
      <stop offset="50%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#22d3ee" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  
  <!-- Heart base -->
  <path d="M32 50 C18 38 12 28 12 20 C12 13.5 17 9 23.5 9 C27.5 9 30.5 11 32 13.5 C33.5 11 36.5 9 40.5 9 C47 9 52 13.5 52 20 C52 28 46 38 32 50 Z" 
        fill="url(#fav-grad)" 
        fill-opacity="0.2" 
        stroke="url(#fav-grad)" 
        stroke-width="2" 
        stroke-linejoin="round"/>
        
  <!-- Glowing ECG Pulse line through heart -->
  <path d="M14 26 L23 26 L26 21 L29 33 L33 16 L37 36 L40 26 L50 26" 
        stroke="#22d3ee" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#fav-glow)"/>
        
  <!-- Glowing pulse spark point -->
  <circle cx="37" cy="36" r="2" fill="#ffffff" filter="url(#fav-glow)"/>
</svg>